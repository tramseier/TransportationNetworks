[project]
name = "QDTA_RC"
description = "Test network and demand definitions shared by the QDTA and Route_choice_TR repos"
version = "1.0.0"
requires-python = ">3.12"

[tool.setuptools]
package-dir = {"" = ".."}
packages = ["QDTA_RC"]
